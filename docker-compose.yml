services:
  browsewright-runner:
    image: yuimax/browsewright-runner:latest
    container_name: browsewright-runner
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATA_DIR: "/var/lib/browsewright"
      BROWSEWRIGHT_CONFIG_DIR: "/var/lib/browsewright/config"
      APP_ORIGIN: "http://localhost:8787"
      HEADLESS: "false"
      BROWSER_BACKEND: "patchright"
      # 风控站点（如淘宝详情页）的决定性因素是出口 IP 信誉。机房/被刷过的 IP 会触发 punish 页，
      # 即便人工滑过滑块也会返回 FWqx。挂一个住宅/干净代理可显著降低触发率。留空则不走代理。
      BROWSER_PROXY: "${BROWSER_PROXY:-}"
      BROWSER_PROXY_BYPASS: "${BROWSER_PROXY_BYPASS:-}"
      BROWSER_PROXY_USERNAME: "${BROWSER_PROXY_USERNAME:-}"
      BROWSER_PROXY_PASSWORD: "${BROWSER_PROXY_PASSWORD:-}"
      BROWSEWRIGHT_AUTH_ENABLED: "${BROWSEWRIGHT_AUTH_ENABLED:-false}"
      BROWSEWRIGHT_LLM_SCOPE: "${BROWSEWRIGHT_LLM_SCOPE:-shared}"
      BROWSEWRIGHT_ADMIN_USER: "${BROWSEWRIGHT_ADMIN_USER:-admin}"
      BROWSEWRIGHT_ADMIN_PASSWORD: "${BROWSEWRIGHT_ADMIN_PASSWORD:-}"
      BROWSEWRIGHT_CLOUD_URL: "${BROWSEWRIGHT_CLOUD_URL:-}"
      BROWSEWRIGHT_DEVICE_TOKEN: "${BROWSEWRIGHT_DEVICE_TOKEN:-}"
    volumes:
      - browsewright-data:/var/lib/browsewright

volumes:
  browsewright-data:
